<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1><img src="{{ url_for('static', filename='mentatRed.png') }}" alt="Mentat Logo" class="mentat-logo"> Mentat</h1>
            <div class="status-bar">
                <span id="connection-status">Connecting...</span>
            </div>
        </header>

        <div class="controls-panel">
            <div class="controls-left">
                <span id="camera-count">Cameras: 0</span>
            </div>
            <div class="controls-right">
                <button id="toggle-yolo-btn" class="toggle-btn yolo-enabled">YOLO ON</button>
                <button id="toggle-boxes-btn" class="toggle-btn">Toggle Boxes</button>
                <button id="toggle-blip-btn" class="toggle-btn blip-enabled">BLIP ON</button>
            </div>
        </div>

        <main>
            <div class="camera-grid" id="camera-grid">
                <!-- Camera feeds will be dynamically added here -->
            </div>
            
            <div class="yolo-stats-panel" id="yolo-stats-panel">
                <h3>YOLO Processing Stats</h3>
                <div id="yolo-stats-content">
                    <p>Initializing YOLO detector...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Mentat - Real-time monitoring</p>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
